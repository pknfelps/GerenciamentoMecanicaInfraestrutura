name: ci
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - name: Format, validate and render
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -lockfile=readonly
          terraform -chdir=terraform validate -no-color
          terraform -chdir=bootstrap fmt -check -recursive
          terraform -chdir=bootstrap init -backend=false -lockfile=readonly
          terraform -chdir=bootstrap validate -no-color
          terraform -chdir=gateway fmt -check -recursive
          terraform -chdir=gateway init -backend=false -lockfile=readonly
          terraform -chdir=gateway validate -no-color
          kubectl kustomize kubernetes
          kubectl kustomize kubernetes/observability/hom
          kubectl kustomize kubernetes/observability/prd
      - name: Validate New Relic exporter without AWS credentials
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE/kubernetes/observability/base/collector.yaml:/etc/collector.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0
          validate --config=/etc/collector.yaml
          '--config=yaml:exporters::otlphttp/newrelic::headers::api-key: local-test-license'
