name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Check formatting
        run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize providers without backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform -chdir=terraform validate -no-color

  kubernetes-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1
      - name: Render active manifests
        run: kubectl kustomize kubernetes > "$RUNNER_TEMP/kubernetes.yaml"
