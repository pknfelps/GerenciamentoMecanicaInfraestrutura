name: base-provision
run-name: base-provision / ${{ inputs.environment }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Destino: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]

permissions: {}
concurrency:
  group: base-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  CHECKPOINT_DISABLE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check branch and environment
        run: |
          test "$GITHUB_REF" = "refs/heads/$( [ "$TARGET_ENVIRONMENT" = hom ] && echo develop || echo main )"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_BASE_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: base-plan-${{ github.run_id }}
      - run: terraform init -backend-config="backends/$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform plan -var-file="environments/$TARGET_ENVIRONMENT.tfvars" -out=tfplan -no-color -lock-timeout=60s
      - name: Present saved plan
        run: terraform show -no-color tfplan | tee tfplan.txt
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: base-provision-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 7

  approval:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ format('{0}-approval', inputs.environment) }}
    permissions: {}
    steps:
      - run: echo 'Plano desta execucao aprovado pelo Environment protegido.'

  apply:
    needs: [plan, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      KUBECONFIG: /tmp/mecanica-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_BASE_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: base-apply-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: terraform
          merge-multiple: true
      - run: terraform -chdir=terraform init -backend-config="backends/$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
      - name: Apply approved plan
        run: terraform -chdir=terraform apply -no-color -lock-timeout=60s tfplan
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - name: Apply base Kubernetes manifests
        run: |
          aws eks update-kubeconfig --region us-east-1 --name "mecanica-$TARGET_ENVIRONMENT-eks"
          kubectl apply -k kubernetes
