name: base-destroy
run-name: base-destroy / ${{ inputs.environment }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Destino: develop/hom ou main/prd'
        required: true
        default: hom
        type: choice
        options: [hom, prd]

permissions: {}
concurrency:
  group: base-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET_ENVIRONMENT: ${{ inputs.environment }}
  AWS_REGION: us-east-1
  AWS_PAGER: ''
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_WORKSPACE: default
  CHECKPOINT_DISABLE: '1'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check branch and environment
        run: |
          case "$TARGET_ENVIRONMENT:$GITHUB_REF" in
            hom:refs/heads/develop|prd:refs/heads/main) ;;
            *) echo '::error::Use develop/hom ou main/prd'; exit 1 ;;
          esac
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_BASE_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: base-plan-${{ github.run_id }}
      - name: Check database removal
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in hom|prd) ;; *) exit 1 ;; esac
          test "$AWS_REGION" = us-east-1
          name="mecanica-$TARGET_ENVIRONMENT-postgres"
          instances="$(aws rds describe-db-instances --query "DBInstances[?DBInstanceIdentifier=='$name'].[DBInstanceIdentifier,DBInstanceStatus]" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$instances" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: RDS $name ainda existe ou resposta invalida. Conclua database-destroy, inclusive se o RDS estiver deleting."
            exit 1
          fi
          subnet_group="mecanica-$TARGET_ENVIRONMENT-database"
          subnet_groups="$(aws rds describe-db-subnet-groups --query "DBSubnetGroups[?DBSubnetGroupName=='$subnet_group'].DBSubnetGroupName" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$subnet_groups" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: DB subnet group $subnet_group encontrado ou resposta invalida. Conclua database-destroy."
            exit 1
          fi
          groups="$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$name" \
            --query 'SecurityGroups[].GroupId' --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$groups" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: SG $name encontrado ou resposta invalida. Conclua database-destroy."
            exit 1
          fi

      - run: terraform init -backend-config="backends/$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform plan -destroy -var-file="environments/$TARGET_ENVIRONMENT.tfvars" -out=tfplan -no-color -lock-timeout=60s
      - name: Present saved plan
        run: terraform show -no-color tfplan | tee tfplan.txt
      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: base-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            terraform/tfplan
            terraform/tfplan.txt
          if-no-files-found: error
          retention-days: 7

  approval:
    needs: plan
    runs-on: ubuntu-24.04
    environment: ${{ format('{0}-approval', inputs.environment) }}
    permissions: {}
    steps:
      - run: echo 'Plano desta execucao aprovado pelo Environment protegido.'

  apply:
    needs: [plan, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      KUBECONFIG: /tmp/mecanica-kubeconfig
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: ${{ vars.AWS_BASE_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          role-session-name: base-apply-${{ github.run_id }}
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact_id }}
          path: terraform
          merge-multiple: true
      - run: terraform -chdir=terraform init -backend-config="backends/$TARGET_ENVIRONMENT.hcl" -lockfile=readonly
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.0
      - name: Check database removal
        run: |
          set -euo pipefail
          case "$TARGET_ENVIRONMENT" in hom|prd) ;; *) exit 1 ;; esac
          test "$AWS_REGION" = us-east-1
          name="mecanica-$TARGET_ENVIRONMENT-postgres"
          instances="$(aws rds describe-db-instances --query "DBInstances[?DBInstanceIdentifier=='$name'].[DBInstanceIdentifier,DBInstanceStatus]" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$instances" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: RDS $name ainda existe ou resposta invalida. Conclua database-destroy, inclusive se o RDS estiver deleting."
            exit 1
          fi
          subnet_group="mecanica-$TARGET_ENVIRONMENT-database"
          subnet_groups="$(aws rds describe-db-subnet-groups --query "DBSubnetGroups[?DBSubnetGroupName=='$subnet_group'].DBSubnetGroupName" --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$subnet_groups" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: DB subnet group $subnet_group encontrado ou resposta invalida. Conclua database-destroy."
            exit 1
          fi
          groups="$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$name" \
            --query 'SecurityGroups[].GroupId' --output json)"
          if ! jq -e 'type == "array" and length == 0' <<< "$groups" > /dev/null; then
            echo "::error::$TARGET_ENVIRONMENT: SG $name encontrado ou resposta invalida. Conclua database-destroy."
            exit 1
          fi

      - name: Configure Kubernetes access
        run: aws eks update-kubeconfig --region us-east-1 --name "mecanica-$TARGET_ENVIRONMENT-eks"
      - name: Remove API Collector
        run: kubectl delete -k "kubernetes/observability/$TARGET_ENVIRONMENT" --ignore-not-found=true --cascade=foreground --wait=true --timeout=300s
      - name: Remove base Kubernetes manifests
        run: kubectl delete -k kubernetes --ignore-not-found=true --wait=true
      - name: Apply approved plan
        run: terraform -chdir=terraform apply -no-color -lock-timeout=60s tfplan
