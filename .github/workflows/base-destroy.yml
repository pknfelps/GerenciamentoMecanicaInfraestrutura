name: base-destroy
run-name: Descarte ${{ inputs.environment }} / ${{ inputs.action }} / ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Base a descartar: develop/hom ou main/prd; bootstrap preservado'
        required: true
        default: hom
        type: choice
        options: [hom, prd]
      action:
        description: 'destroy: plano, aprovação e descarte; plan: somente consultar exclusões'
        required: true
        default: plan
        type: choice
        options: [plan, destroy]

permissions: {}

# Mesmo grupo do provisionamento, incluindo a espera pela aprovação.
concurrency:
  group: base-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  plan:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      sha256: ${{ steps.plan.outputs.sha256 }}
      destructive: ${{ steps.plan.outputs.destructive }}
      has_changes: ${{ steps.plan.outputs.has_changes }}
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      CONFIGURED_REGION: ${{ vars.AWS_REGION }}
      CONFIGURED_ROLE_ARN: ${{ vars.AWS_BASE_ROLE_ARN }}
      CONFIGURED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_PAGER: ''
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate target before AWS authentication
        run: ./scripts/Assert-BasePipelineTarget.ps1 -Environment $env:TARGET_ENVIRONMENT -Action plan -Operation destroy
      - name: Require a configured approval environment for destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-BaseApprovalEnvironment.ps1 -Environment $env:TARGET_ENVIRONMENT
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Authenticate base role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.CONFIGURED_REGION }}
          role-to-assume: ${{ env.CONFIGURED_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          audience: sts.amazonaws.com
          role-session-name: base-plan-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          translate-env-variables: false
      - name: Plan and publish only the review summary
        id: plan
        run: ./scripts/Invoke-BasePipeline.ps1 -Environment $env:TARGET_ENVIRONMENT -Action plan -Operation destroy

  approval:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && needs.plan.outputs.has_changes == 'true'
    name: Aprovar descarte da base
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: ${{ inputs.environment == 'prd' && 'prd-approval' || 'hom-approval' }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary
    permissions: {}
    steps:
      # Este job não recebe OIDC, credenciais AWS, planos binários ou states.
      - name: Record approval of this run
        run: echo 'Descarte desta execução aprovado. O apply verificará automaticamente o mesmo commit e fingerprint.'

  destroy:
    needs: [plan, approval]
    if: needs.plan.result == 'success' && needs.approval.result == 'success' && inputs.action == 'destroy' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        shell: pwsh
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
      TARGET_ACTION: apply
      EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
      APPROVED_PLAN_SHA256: ${{ needs.plan.outputs.sha256 }}
      CONFIGURED_REGION: ${{ vars.AWS_REGION }}
      CONFIGURED_ROLE_ARN: ${{ vars.AWS_BASE_ROLE_ARN }}
      CONFIGURED_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_PAGER: ''
      TF_IN_AUTOMATION: 'true'
      CHECKPOINT_DISABLE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the commit and fingerprint passed by the plan job
        run: |
          if (!$env:EXPECTED_COMMIT -or !$env:APPROVED_PLAN_SHA256) { throw 'Metadados do job plan ausentes; nenhum apply autorizado.' }
          ./scripts/Assert-BasePipelineTarget.ps1 -Environment $env:TARGET_ENVIRONMENT -Action $env:TARGET_ACTION -Operation destroy -ExpectedCommit $env:EXPECTED_COMMIT -ApprovedPlanSha256 $env:APPROVED_PLAN_SHA256
      - name: Recheck approval configuration before AWS authentication
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Assert-BaseApprovalEnvironment.ps1 -Environment $env:TARGET_ENVIRONMENT
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Authenticate base role after approval with fresh credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ env.CONFIGURED_REGION }}
          role-to-assume: ${{ env.CONFIGURED_ROLE_ARN }}
          allowed-account-ids: '121754142617'
          audience: sts.amazonaws.com
          role-session-name: base-destroy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          unset-current-credentials: true
          use-existing-credentials: false
          output-credentials: false
          translate-env-variables: false
      - name: Replan, compare, destroy and verify the selected base
        run: ./scripts/Invoke-BasePipeline.ps1 -Environment $env:TARGET_ENVIRONMENT -Action $env:TARGET_ACTION -Operation destroy -ExpectedCommit $env:EXPECTED_COMMIT -ApprovedPlanSha256 $env:APPROVED_PLAN_SHA256
