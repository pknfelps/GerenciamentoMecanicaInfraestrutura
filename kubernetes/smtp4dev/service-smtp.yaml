apiVersion: v1
kind: Service
metadata:
  name: smtp4dev-smtp
  labels:
    app.kubernetes.io/name: smtp4dev
    app.kubernetes.io/part-of: mecanica-email
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: smtp4dev
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
      nodePort: 30025
      protocol: TCP
