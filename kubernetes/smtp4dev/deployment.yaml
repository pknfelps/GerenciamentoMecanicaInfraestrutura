apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp4dev
  labels:
    app.kubernetes.io/name: smtp4dev
    app.kubernetes.io/part-of: mecanica-email
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: smtp4dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smtp4dev
        app.kubernetes.io/part-of: mecanica-email
    spec:
      serviceAccountName: smtp4dev
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smtp4dev
          image: rnwood/smtp4dev:3.15.0
          imagePullPolicy: IfNotPresent
          workingDir: /app
          env:
            - name: SERVEROPTIONS__URLS
              value: http://*:8080
            - name: HOME
              value: /smtp4dev
          ports:
            - name: smtp
              containerPort: 2525
              protocol: TCP
            - name: web
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 256Mi
              ephemeral-storage: 64Mi
          startupProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: smtp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: web
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: configuration
              mountPath: /app/appsettings.json
              subPath: appsettings.json
              readOnly: true
            - name: runtime-data
              mountPath: /smtp4dev
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: smtp4dev-config
            defaultMode: 0444
        - name: runtime-data
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: temporary
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
