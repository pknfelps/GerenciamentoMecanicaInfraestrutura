apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - namespace.yaml
  - service-account.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - collector.yaml
generatorOptions:
  disableNameSuffixHash: true
