extensions:
  health_check:
    endpoint: 0.0.0.0:13133
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_NAME}:10250
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    insecure_skip_verify: false
    metric_groups: [node, pod, container]
    resource_attributes:
      container.id:
        enabled: false
    metrics:
      k8s.node.uptime:
        enabled: true
      k8s.node.network.errors:
        enabled: false
      k8s.node.network.io:
        enabled: false
      k8s.pod.network.errors:
        enabled: false
      k8s.pod.network.io:
        enabled: false
  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 30s
    metadata_collection_interval: 0s
    distribution: kubernetes
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    allocatable_types_to_report: [cpu, memory]
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  filter/kubernetes:
    metrics:
      include:
        match_type: strict
        metric_names:
          - k8s.node.cpu.usage
          - k8s.pod.cpu.usage
          - container.cpu.usage
          - k8s.node.memory.working_set
          - k8s.pod.memory.working_set
          - container.memory.working_set
          - k8s.node.memory.available
          - k8s.node.uptime
          - k8s.node.condition_ready
          - k8s.node.condition_memory_pressure
          - k8s.node.condition_disk_pressure
          - k8s.node.condition_pid_pressure
          - k8s.node.allocatable_cpu
          - k8s.node.allocatable_memory
          - k8s.pod.phase
          - k8s.container.ready
          - k8s.container.restarts
          - k8s.deployment.desired
          - k8s.deployment.available
          - k8s.container.cpu_request
          - k8s.container.cpu_limit
          - k8s.container.memory_request
          - k8s.container.memory_limit
  k8sattributes:
    auth_type: serviceAccount
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.node.name
        - k8s.deployment.name
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection
  transform/kubernetes:
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["k8s.namespace.name", "k8s.pod.name", "k8s.pod.uid", "k8s.node.name", "k8s.deployment.name", "k8s.container.name"])
  resource/cluster:
    attributes:
      - key: k8s.cluster.name
        value: ${env:K8S_CLUSTER_NAME}
        action: insert
      - key: deployment.environment.name
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: insert
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 512
exporters:
  otlphttp/newrelic:
    endpoint: https://otlp.nr-data.net
    headers:
      api-key: ${secretsmanager:${env:NEW_RELIC_LICENSE_KEY_SECRET}}
    compression: gzip
    timeout: 3s
    sending_queue:
      enabled: true
      queue_size: 100
      num_consumers: 2
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 5s
      max_elapsed_time: 15s
service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/cluster, batch]
      exporters: [otlphttp/newrelic]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/cluster, batch]
      exporters: [otlphttp/newrelic]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, resource/cluster, batch]
      exporters: [otlphttp/newrelic]
    metrics/kubernetes:
      receivers: [kubeletstats, k8s_cluster]
      processors: [memory_limiter, filter/kubernetes, k8sattributes, transform/kubernetes, resource/cluster, batch]
      exporters: [otlphttp/newrelic]
